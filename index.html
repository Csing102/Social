<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattzApp Pro Extreme - Ultimate Ed.</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f5d64; }
        
        .chat-input::placeholder { color: #8696a0; }
        
        .recording-pulse { 
            animation: pulse-record 1s infinite ease-in-out; 
            color: #ef4444 !important; 
        }
        @keyframes pulse-record {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(239,68,68,0)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 8px rgba(239,68,68,0.5)); }
        }

        .typing-dot { 
            animation: typing 1.4s infinite; 
            display: inline-block; 
            width: 4px; height: 4px; 
            border-radius: 50%; 
            background-color: #8696a0; 
            margin: 0 1px; 
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
          0% { opacity: 0.1; }
          20% { opacity: 1; }
          100% { opacity: 0.1; }
        }
    </style>
</head>
<body class="bg-[#0b141a] text-[#e9edef] h-screen w-screen overflow-hidden font-sans antialiased selection:bg-[#00a884]/30">

    <div id="auth-view" class="w-full h-full flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-[#222e35] p-8 rounded-2xl border border-[#222e35] shadow-2xl space-y-6">
            <div class="text-center">
                <div class="inline-flex p-4 bg-[#00a884]/10 rounded-full text-[#00a884] border border-[#00a884]/20 shadow-[0_0_20px_rgba(0,168,132,0.2)] mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white mt-3">WattzApp Pro Extreme</h1>
                <p id="auth-subtitle" class="text-xs text-[#8696a0] mt-1">Sign in with your database cluster identity node credentials</p>
            </div>
            
            <div class="space-y-3">
                <input type="text" id="auth-name" placeholder="Full Profile Name" class="hidden w-full bg-[#2a3942] text-white rounded-xl px-4 py-3 text-sm placeholder-[#8696a0] border border-transparent focus:border-[#00a884] focus:outline-none transition-all">
                <input type="text" id="auth-username" placeholder="Unique Username Handle" class="hidden w-full bg-[#2a3942] text-white rounded-xl px-4 py-3 text-sm placeholder-[#8696a0] border border-transparent focus:border-[#00a884] focus:outline-none transition-all">
                <input type="email" id="auth-email" placeholder="Email Address" class="w-full bg-[#2a3942] text-white rounded-xl px-4 py-3 text-sm placeholder-[#8696a0] border border-transparent focus:border-[#00a884] focus:outline-none transition-all">
                <input type="password" id="auth-password" placeholder="Secure Password" class="w-full bg-[#2a3942] text-white rounded-xl px-4 py-3 text-sm placeholder-[#8696a0] border border-transparent focus:border-[#00a884] focus:outline-none transition-all">
                <button onclick="submitAuthForm()" id="auth-btn" class="w-full bg-[#00a884] text-black font-semibold rounded-xl py-3.5 text-sm hover:bg-[#008f72] shadow-lg transition-all active:scale-[0.99] mt-2">Sign In</button>
            </div>
            
            <div class="text-center text-xs text-[#8696a0] pt-1">
                <span id="auth-toggle-msg">New operational user node?</span>
                <button onclick="toggleAuthMode()" id="auth-toggle-link" class="text-[#00a884] hover:underline font-medium ml-1 bg-transparent">Create account</button>
            </div>
        </div>
    </div>

    <div id="app-view" class="hidden w-full h-full flex overflow-hidden">
        
        <aside class="w-[360px] bg-[#111b21] border-r border-[#222e35]/60 flex flex-col h-full flex-shrink-0 z-20">
            <header class="h-[64px] bg-[#202c33] px-4 flex items-center justify-between border-b border-[#222e35]/30 shadow-sm">
                <div class="flex items-center gap-3">
                    <img id="user-avatar" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-10 h-10 rounded-full cursor-pointer object-cover border-2 border-[#222e35]/80 hover:border-[#00a884] transition-all" onclick="openModal('profile-modal')">
                    <div class="min-w-0">
                        <p id="user-name-display" class="text-sm font-semibold text-[#e9edef] truncate"></p>
                        <p id="user-username-display" class="text-[11px] text-[#8696a0] truncate"></p>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-[#aebac1]">
                    <button onclick="createNewChannel()" class="p-2 hover:bg-[#2a3942] hover:text-white rounded-xl transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
                    <button onclick="createNewPrivateChat()" class="p-2 hover:bg-[#2a3942] hover:text-white rounded-xl transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg></button>
                    <button onclick="terminateSession()" class="p-2 hover:bg-[#2a3942] hover:text-red-400 rounded-xl transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </header>
            
            <div class="p-3 bg-[#111b21] border-b border-[#222e35]/30">
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-[#8696a0]"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <input type="text" placeholder="Search operational interface nodes..." class="w-full bg-[#202c33] text-xs rounded-xl pl-10 pr-4 py-2.5 text-[#e9edef] placeholder-[#8696a0] focus:outline-none focus:ring-1 focus:ring-[#222e35]">
                </div>
            </div>
            
            <div id="channels-list" class="flex-1 overflow-y-auto custom-scroll divide-y divide-[#222e35]/30"></div>
        </aside>

        <main class="flex-1 bg-[#0b141a] flex flex-col h-full relative z-10">
            <header class="h-[64px] bg-[#202c33] px-4 flex items-center justify-between border-b border-[#222e35]/20 shadow-sm">
                <div class="flex items-center gap-3.5 min-w-0">
                    <img id="active-room-avatar" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-10 h-10 rounded-full object-cover border border-[#222e35]/60 flex-shrink-0">
                    <div class="min-w-0">
                        <h2 id="active-room-title" class="text-sm font-semibold text-white tracking-wide truncate">Select an operation context node</h2>
                        <div id="active-room-status" class="text-[11px] font-medium tracking-wide mt-0.5 min-h-[15px] flex items-center gap-1.5"></div>
                    </div>
                </div>
                
                <div id="call-actions" class="hidden flex items-center gap-2 text-[#aebac1]">
                    <button onclick="createNewCall('audio')" class="p-2.5 hover:bg-[#2a3942] hover:text-[#00a884] rounded-xl transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
                    <button onclick="createNewCall('video')" class="p-2.5 hover:bg-[#2a3942] hover:text-[#00a884] rounded-xl transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7a2 2 0 0 0-2.45-1.45L16 7V5a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2l4.55 1.45A2 2 0 0 0 23 17V7z"/></svg></button>
                    <button onclick="promptDeleteCurrentChat()" class="p-2.5 hover:bg-[#2a3942] hover:text-red-400 rounded-xl transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                </div>
            </header>

            <div id="messages-flow" class="flex-1 overflow-y-auto custom-scroll p-6 space-y-3.5 bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')] bg-opacity-[0.015]"></div>

            <footer id="input-dock" class="hidden min-h-[64px] bg-[#202c33] px-4 py-2.5 flex items-center gap-3 border-t border-[#222e35]/40 relative">
                <div class="relative flex-none">
                    <button onclick="toggleElement('media-menu')" class="p-2.5 text-[#aebac1] hover:bg-[#2a3942] hover:text-white rounded-xl transition-all flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                    <div id="media-menu" class="hidden absolute bottom-full mb-3 left-0 bg-[#233138] rounded-xl shadow-2xl py-2 w-48 border border-[#222e35] text-xs font-medium space-y-0.5 transform scale-95 opacity-0 transition-all origin-bottom-left">
                        <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-[#111b21]/70 cursor-pointer text-[#e9edef]"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" w="18" h="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Image Pipeline<input type="file" accept="image/*" class="hidden" onchange="processMediaFile(this, 'image')"></label>
                        <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-[#111b21]/70 cursor-pointer text-[#e9edef]"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7a2 2 0 0 0-2.45-1.45L16 7V5a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2l4.55 1.45A2 2 0 0 0 23 17V7z"/></svg> Video File<input type="file" accept="video/*" class="hidden" onchange="processMediaFile(this, 'video')"></label>
                        <button onclick="openMediaSearchModal('gif')" class="w-full text-left flex items-center gap-3 px-4 py-2.5 hover:bg-[#111b21]/70 text-[#e9edef]"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" w="18" h="18" rx="2" ry="2"/><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg> Giphy Asset</button>
                    </div>
                </div>

                <div class="flex-1 relative">
                    <input type="text" id="msg-field" placeholder="Type data message stream..." class="chat-input w-full bg-[#2a3942] rounded-xl px-4 py-3 text-xs text-white placeholder-[#8696a0] focus:outline-none border border-transparent focus:border-[#222e35]/80 transition-all" oninput="handleInputFieldChange(this)">
                    <div id="username-suggestions" class="hidden absolute bottom-full mb-2 left-0 w-full bg-[#233138] rounded-xl shadow-2xl border border-[#222e35] max-h-40 overflow-y-auto custom-scroll divide-y divide-[#222e35]/30"></div>
                </div>
                <button id="mic-trigger" onclick="handleVoiceNoteRecording()" class="flex-none p-2.5 text-[#aebac1] hover:bg-[#2a3942] hover:text-white rounded-xl transition-all flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v10a3 3 0 0 0 3-3V1a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3H12z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
            </footer>
        </main>
    </div>

    <div id="notification-container" class="fixed top-4 right-4 z-[100] space-y-3 w-80"></div>

    <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[80] p-4">
        <div class="bg-[#222e35] rounded-2xl p-6 w-full max-w-md border border-[#222e35] space-y-5 shadow-2xl overflow-y-auto custom-scroll max-h-[90vh]">
            <h3 class="text-lg font-bold text-white tracking-wide">Account settings matrix</h3>
            
            <div class="flex flex-col items-center gap-3 border-b border-[#222e35]/40 pb-4">
                <img id="edit-avatar-preview" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-24 h-24 rounded-full object-cover border-4 border-[#222e35]">
                <label class="bg-[#202c33] text-[#e9edef] text-xs px-4 py-2 rounded-xl cursor-pointer hover:bg-[#2a3942] transition-all">Change Picture Pipeline<input type="file" accept="image/*" class="hidden" onchange="previewAndSetAvatar(this)"></label>
            </div>

            <div class="space-y-3">
                <input type="text" id="edit-name" placeholder="Display Profile Name" class="w-full bg-[#2a3942] rounded-xl px-4 py-3 text-sm text-white placeholder-[#8696a0] border border-transparent focus:border-[#00a884]">
                <input type="text" id="edit-username" placeholder="Unique Handle (username)" class="w-full bg-[#2a3942] rounded-xl px-4 py-3 text-sm text-white placeholder-[#8696a0] border border-transparent focus:border-[#00a884]">
            </div>

            <div class="border-t border-[#222e35]/40 pt-4 space-y-3">
                <h4 class="text-sm font-semibold text-white">Change Password Token</h4>
                <input type="password" id="edit-new-password" placeholder="New Password Cluster" class="w-full bg-[#2a3942] rounded-xl px-4 py-3 text-sm text-white placeholder-[#8696a0] border border-transparent focus:border-[#00a884]">
                <input type="password" id="edit-confirm-password" placeholder="Confirm New Password Cluster" class="w-full bg-[#2a3942] rounded-xl px-4 py-3 text-sm text-white placeholder-[#8696a0] border border-transparent focus:border-[#00a884]">
            </div>

            <div class="border-t border-[#222e35]/40 pt-4 space-y-3">
                <h4 class="text-sm font-semibold text-red-400">Danger Zone Operation</h4>
                <button onclick="confirmAccountDeletion()" class="w-full bg-red-500/10 text-red-400 font-medium rounded-xl py-3 text-sm hover:bg-red-500 hover:text-white transition-all">Delete Account Permanently</button>
            </div>

            <div class="flex justify-end gap-2.5 pt-1">
                <button onclick="closeModal('profile-modal')" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-[#8696a0] hover:bg-[#111b21]/70">Cancel</button>
                <button onclick="commitProfileUpdates()" class="px-5 py-2.5 bg-[#00a884] text-black font-semibold rounded-xl text-xs hover:bg-[#008f72]">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="media-search-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[80] p-4">
        <div class="bg-[#222e35] rounded-2xl p-6 w-full max-w-xl border border-[#222e35] space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 id="media-search-title" class="text-lg font-bold text-white"></h3>
                <button onclick="closeModal('media-search-modal')" class="text-[#8696a0] hover:text-white">&times;</button>
            </div>
            <div class="relative">
                <input type="text" id="media-search-input" placeholder="Search operational interface nodes..." class="w-full bg-[#202c33] text-sm rounded-xl px-4 py-3 text-[#e9edef] placeholder-[#8696a0] border border-[#222e35] focus:outline-none">
                <button onclick="performMediaSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-[#00a884] text-black text-xs font-semibold px-4 py-1.5 rounded-lg hover:bg-[#008f72]">Search</button>
            </div>
            <div id="media-search-results" class="grid grid-cols-3 gap-3 max-h-80 overflow-y-auto custom-scroll p-1"></div>
        </div>
    </div>

    <div id="incoming-call-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-[110] p-6">
        <div class="flex flex-col items-center space-y-8 text-center">
            <img id="incoming-caller-avatar" src="" class="w-32 h-32 rounded-full object-cover ring-8 ring-[#00a884]/20 animate-pulse">
            <div class="space-y-1">
                <h2 id="incoming-caller-name" class="text-2xl font-bold text-white tracking-wide"></h2>
                <p id="incoming-call-type" class="text-sm text-[#00a884] font-medium tracking-widest uppercase"></p>
            </div>
            <div class="flex gap-10">
                <button onclick="rejectIncomingCall()" class="w-20 h-20 rounded-full bg-red-500 text-white flex items-center justify-center shadow-xl hover:bg-red-600 transition-all transform hover:scale-105 active:scale-95"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" fill="currentColor"/></svg></button>
                <button onclick="acceptIncomingCall()" class="w-20 h-20 rounded-full bg-[#00a884] text-black flex items-center justify-center shadow-xl hover:bg-[#008f72] transition-all transform hover:scale-105 active:scale-95"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="currentColor"/></svg></button>
            </div>
        </div>
    </div>

    <div id="call-panel" class="hidden fixed inset-0 bg-[#0b141a]/95 backdrop-blur-md flex flex-col items-center justify-center z-[100] p-6">
        <div class="w-full max-w-4xl h-full flex flex-col items-center space-y-6">
            <div class="text-center space-y-2">
                <div class="relative inline-block">
                    <img id="call-peer-avatar" src="" class="w-24 h-24 rounded-full object-cover ring-4 ring-[#00a884] shadow-2xl">
                    <div id="call-type-indicator" class="absolute -bottom-1 -right-1 bg-[#202c33] p-2 rounded-full border border-[#222e35] text-white flex items-center justify-center shadow-md"></div>
                </div>
                <h2 id="call-peer-name" class="text-xl font-bold text-white tracking-wide"></h2>
                <p id="call-status-string" class="text-xs text-[#00a884] font-semibold tracking-widest uppercase">Connecting signaling matrix...</p>
            </div>

            <div id="video-streams" class="hidden w-full flex-1 grid grid-cols-2 gap-4 bg-[#111b21] rounded-2xl p-4 border border-[#222e35] shadow-inner relative">
                <div class="bg-black rounded-xl overflow-hidden relative border border-[#222e35]/40">
                    <video id="remote-video-track" autoplay playsinline class="w-full h-full object-cover"></video>
                    <span id="remote-track-label" class="absolute bottom-2.5 left-2.5 bg-black/60 backdrop-blur-sm px-3 py-1 rounded-lg text-xs font-medium text-[#e9edef]">Remote Stream Node</span>
                </div>
                <div class="bg-black rounded-xl overflow-hidden relative border border-[#222e35]/40 transition-all duration-300" id="local-video-container">
                    <video id="local-video-track" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
                    <span class="absolute bottom-2.5 left-2.5 bg-black/60 backdrop-blur-sm px-3 py-1 rounded-lg text-xs font-medium text-[#e9edef]">Local client pipeline</span>
                </div>
            </div>
            
            <div id="audio-visualizer" class="hidden w-full flex-1 flex items-center justify-center gap-1.5 p-10 bg-[#111b21] rounded-2xl border border-[#222e35]">
                <div class="w-2.5 h-20 bg-[#00a884] rounded-full animate-pulse"></div>
                <div class="w-2.5 h-32 bg-[#00a884]/80 rounded-full animate-pulse delay-75"></div>
                <div class="w-2.5 h-40 bg-[#00a884] rounded-full animate-pulse delay-150"></div>
                <div class="w-2.5 h-32 bg-[#00a884]/80 rounded-full animate-pulse delay-75"></div>
                <div class="w-2.5 h-20 bg-[#00a884] rounded-full animate-pulse"></div>

        // =========================================================================
        // REAL-TIME SYNC & SPY NETWORKS
        // =========================================================================
        function configureRealtimeGlobalSubscriptions() {
            if(globalMsgSubscription) globalMsgSubscription.unsubscribe();
            if(broadcastTypingSubscription) broadcastTypingSubscription.unsubscribe();
            if(signalingCallSubscription) signalingCallSubscription.unsubscribe();

            // Realtime Message Stream
            globalMsgSubscription = _client.channel("realtime-msgs")
            .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, async (payload) => {
                if(!selectedChannel) return;
                if(payload.new?.channel_id === selectedChannel.id || payload.old?.channel_id === selectedChannel.id) {
                    if(payload.new && payload.new.sender_id !== localUser.id) {
                        await markMessagesAsReadInChannel(selectedChannel.id);
                    }
                    await extractRenderMessagesFlowChain();
                } else if(payload.new && payload.new.sender_id !== localUser.id) {
                    const sender = allProfilesList.find(p => p.id === payload.new.sender_id);
                    showCustomNotification(sender ? sender.name : "Incoming Broadcast", "Incoming transmission packet.");
                }
            }).subscribe();

            // Broadcaster Matrix (Typing & SPY)
            broadcastTypingSubscription = _client.channel("realtime-typing")
            .on("broadcast", { event: "metrics" }, (packet) => {
                if(!selectedChannel || packet.payload.room !== selectedChannel.id) return;
                const statusBox = document.getElementById("active-room-status");
                
                // SPY Engine Evaluation Layer
                if(activeRTT_SpyHandle && activeRTT_SpyHandle.toLowerCase() === packet.payload.handler.toLowerCase()) {
                    if(packet.payload.isTyping) {
                        statusBox.innerHTML = `<span class="text-red-400 animate-pulse">● Spy Node Engine:</span> <span class="text-white font-mono bg-black/40 px-1.5 py-0.5 rounded border border-[#ef4444]/20">${packet.payload.rawBuffer}</span>`;
                        const spyAudio = document.getElementById("rtt-spy-audio-node");
                        if(spyAudio.paused) spyAudio.play();
                    } else {
                        statusBox.innerHTML = `<span class="text-red-400">● Spy Node:</span> Idle transmission line.`;
                        document.getElementById("rtt-spy-audio-node").pause();
                    }
                    return;
                }

                if(packet.payload.isTyping) {
                    statusBox.innerHTML = `<div class="flex items-center gap-1.5"><span class="text-[#00a884] font-semibold">${packet.payload.senderName} is writing</span><div class="flex pt-0.5"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
                } else {
                    statusBox.innerHTML = `<span>●</span> Cloud Sync Online`;
                }
            }).subscribe();

            // WebRTC Signaling Matrix
            signalingCallSubscription = _client.channel("realtime-signaling")
            .on("broadcast", { event: "call-signal" }, async (envelope) => {
                const signal = envelope.payload;
                if(signal.targetPeerId !== localUser.id) return;

                switch(signal.action) {
                    case "INVITE_REQUEST":
                        if(currentCallSessionId) {
                            sendWebRTCSignalingPacket(signal.senderId, "BUSY_LINE", signal.sessionId);
                            return;
                        }
                        launchIncomingCallInterfaceOverlay(signal);
                        break;
                    case "ACCEPT_RESPONSE":
                        if(currentCallSessionId === signal.sessionId) {
                            const { data } = await _client.functions.invoke("media-enrichment", { body: { type: "rtc-handshake", action: "get-offer", sessionId: currentCallSessionId } });
                            if(data?.offer) {
                                await peerConnectionContext.setRemoteDescription(new RTCSessionDescription(data.offer));
                                const answer = await peerConnectionContext.createAnswer();
                                await peerConnectionContext.setLocalDescription(answer);
                                sendWebRTCSignalingPacket(targetedCallPeerId, "SDP_ANSWER", currentCallSessionId, { answer });
                            }
                        }
                        break;
                    case "SDP_ANSWER":
                        if(currentCallSessionId === signal.sessionId && peerConnectionContext) {
                            await peerConnectionContext.setRemoteDescription(new RTCSessionDescription(signal.payload.answer));
                        }
                        break;
                    case "ICE_CANDIDATE":
                        if(currentCallSessionId === signal.sessionId && peerConnectionContext && signal.payload.candidate) {
                            try { await peerConnectionContext.addIceCandidate(new RTCIceCandidate(signal.payload.candidate)); } catch(e) {}
                        }
                        break;
                    case "REJECT_TERMINATE":
                        if(currentCallSessionId === signal.sessionId || !currentCallSessionId) cleanAndKillHardwareCallTracks();
                        break;
                    case "BUSY_LINE":
                        showCustomNotification("Routing Fault", "Remote node busy.", "error");
                        cleanAndKillHardwareCallTracks();
                        break;
                }
            }).subscribe();
        }

        // Feature Drivers
        function handleInputFieldChange(element) {
            if(!selectedChannel) return;
            const value = element.value;
            const cursorIndex = element.selectionStart;
            const textSegmentBeforeCursor = value.slice(0, cursorIndex);
            const triggeringMatch = textSegmentBeforeCursor.match(/\/\[see_([a-zA-Z0-9_]*)$/);

            if (selectedChannel.is_group && triggeringMatch) {
                const inputStringQuery = triggeringMatch[1].toLowerCase();
                const suggestions = allProfilesList.filter(p => p.username.toLowerCase().includes(inputStringQuery));
                renderUsernameSuggestionsDropdown(suggestions, triggeringMatch[0]);
            } else {
                document.getElementById("username-suggestions").classList.add("hidden");
            }

            _client.channel("realtime-typing").send({
                type: "broadcast", event: "metrics",
                payload: { room: selectedChannel.id, senderName: localProfile.name, handler: localProfile.username, isTyping: value.length > 0, rawBuffer: value }
            });

            clearTimeout(typingDebounceTimeout);
            typingDebounceTimeout = setTimeout(() => {
                _client.channel("realtime-typing").send({ type: "broadcast", event: "metrics", payload: { room: selectedChannel.id, isTyping: false } });
            }, 2000);
        }

        function renderUsernameSuggestionsDropdown(profiles, matchedToken) {
            const box = document.getElementById("username-suggestions");
            if(profiles.length === 0) { box.classList.add("hidden"); return; }
            box.innerHTML = ""; box.classList.remove("hidden");

            profiles.forEach(p => {
                const option = document.createElement("div");
                option.className = "px-4 py-2 text-xs hover:bg-[#00a884] hover:text-black cursor-pointer text-white flex items-center gap-2 border-b border-[#222e35]/30";
                option.innerHTML = `<img src="${p.profile_picture}" class="w-5 h-5 rounded-md object-cover"> <span>@${p.username}</span>`;
                option.onclick = () => selectUsernameSuggestion(p.username, matchedToken);
                box.appendChild(option);
            });
        }

        function selectUsernameSuggestion(username, matchedToken) {
            const field = document.getElementById("msg-field");
            field.value = field.value.replace(matchedToken, `/[see_${username}]`);
            document.getElementById("username-suggestions").classList.add("hidden");
            field.focus();
        }

        function setupInputMessageListener() {
            document.addEventListener("keydown", (e) => {
                if(e.key === "Enter" && document.activeElement.id === "msg-field") {
                    const value = document.activeElement.value.trim();
                    if(!value) return;

                    if (value.toLowerCase() === "/[stop_see]") {
                        activeRTT_SpyHandle = null;
                        document.getElementById("rtt-spy-audio-node").pause();
                        showCustomNotification("Spy Node", "Real-time key extraction pipeline deactivated.", "success");
                        document.activeElement.value = "";
                        return;
                    }

                    const spyEvaluator = value.match(/^\/\[see_([a-zA-Z0-9_]+)\]$/i);
                    if(spyEvaluator) {
                        activeRTT_SpyHandle = spyEvaluator[1];
                        showCustomNotification("Spy Node", `Lock established on opertional handler @${activeRTT_SpyHandle}.`, "success");
                        document.activeElement.value = "";
                        return;
                    }

                    commitPayloadToDatabase(value);
                    document.activeElement.value = "";
                    _client.channel("realtime-typing").send({ type: "broadcast", event: "metrics", payload: { room: selectedChannel.id, isTyping: false } });
                }
            });
        }

        // Multimedia dispatcher
        function processMediaFile(inputNode, typeString) {
            const assetFile = inputNode.files[0];
            if(!assetFile) return;
            const streamReader = new FileReader();
            streamReader.readAsDataURL(assetFile);
            streamReader.onload = async () => {
                await commitPayloadToDatabase("", typeString, streamReader.result);
                document.getElementById("media-menu").classList.add("hidden");
            };
        }

        async function handleVoiceNoteRecording() {
            const triggerBtn = document.getElementById("mic-trigger");
            if(!audioRecorderInstance || audioRecorderInstance.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioRecorderInstance = new MediaRecorder(stream);
                    audioCapturedChunks = [];
                    audioRecorderInstance.ondataavailable = e => audioCapturedChunks.push(e.data);
                    audioRecorderInstance.onstop = () => {
                        const blob = new Blob(audioCapturedChunks, { type: "audio/ogg; codecs=opus" });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = async () => { await commitPayloadToDatabase("", "audio", reader.result); };
                    };
                    audioRecorderInstance.start();
                    triggerBtn.classList.add("recording-pulse");
                } catch(err) { showCustomNotification("Peripheral Fault", "Audio hardware permissions locked.", "error"); }
            } else { audioRecorderInstance.stop(); triggerBtn.classList.remove("recording-pulse"); }
        }

        // Third-party API Integration Engine
        let mediaSearchDebounceTimeout = null;
        function openMediaSearchModal(type) {
            activeMediaSearchType = type;
            document.getElementById("media-menu").classList.add("hidden");
            document.getElementById("media-search-modal").classList.remove("hidden");
            document.getElementById("media-search-title").innerText = type === "gif" ? "Search Giphy operational database cluster" : "Search iTunes Audio Store cluster";
            document.getElementById("media-search-input").value = "";
            document.getElementById("media-search-results").innerHTML = "";

            // Dynamic live search binding
            document.getElementById("media-search-input").oninput = (e) => {
                clearTimeout(mediaSearchDebounceTimeout);
                mediaSearchDebounceTimeout = setTimeout(() => performMediaSearch(), 500);
            };
        }

        async function performMediaSearch() {
            const query = document.getElementById("media-search-input").value.trim();
            const resultsBox = document.getElementById("media-search-results");
            if(!query) { resultsBox.innerHTML = ""; return; }
            resultsBox.innerHTML = `<div class="col-span-3 text-center py-8 text-xs text-[#8696a0] animate-pulse">Querying core registers...</div>`;

            if(activeMediaSearchType === "gif") {
                const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_OPERATIONAL_KEY}&q=${encodeURIComponent(query)}&limit=9&rating=g`);
                const data = await res.json();
                resultsBox.innerHTML = "";
                data?.data?.forEach(gif => {
                    const url = gif.images?.fixed_height?.url;
                    if(!url) return;
                    const containerNode = document.createElement("div");
                    containerNode.className = "relative rounded-xl overflow-hidden cursor-pointer aspect-video ring-1 ring-[#222e35] hover:ring-[#00a884]";
                    containerNode.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                    containerNode.onclick = () => { triggerMediaAction(url, "gif"); closeModal("media-search-modal"); };
                    resultsBox.appendChild(containerNode);
                });
            } else {
                const { data } = await _client.functions.invoke("media-enrichment", { body: { type: activeMediaSearchType, query: query } });
                resultsBox.innerHTML = "";
                data?.results?.forEach(song => {
                    const boxNode = document.createElement("div");
                    boxNode.className = "bg-[#202c33] p-2.5 rounded-xl border border-[#222e35]/50 hover:border-[#00a884] text-left flex flex-col justify-between h-28 cursor-pointer";
                    boxNode.innerHTML = `
                        <div class="flex gap-2 min-w-0">
                            <img src="${song.artworkUrl60}" class="w-8 h-8 rounded-md object-cover">
                            <div class="min-w-0 flex-1">
                                <p class="text-[11px] font-bold text-white truncate">${song.trackName}</p>
                                <p class="text-[9px] text-[#8696a0] truncate">${song.artistName}</p>
                            </div>
                        </div>
                        <div class="flex gap-1.5 mt-2">
                            <button class="flex-1 text-[9px] bg-[#111b21] text-[#e9edef] font-medium py-1 rounded" onclick="event.stopPropagation(); triggerInlineAudioPlayback('${song.previewUrl}')">Listen</button>
                            <button class="flex-1 text-[9px] bg-[#00a884] text-black font-bold py-1 rounded">Send</button>
                        </div>`;
                    boxNode.onclick = () => { commitPayloadToDatabase("", "music", song.artworkUrl100, song.previewUrl, { artist: song.artistName, title: song.trackName }); closeModal("media-search-modal"); };
                    resultsBox.appendChild(boxNode);
                });
            }
        }

        // WebRTC Signaling Engine
        async function createNewCall(type) {
            if(!targetedCallPeerId) return showCustomNotification("Signal Fault", "Peer node address missing.", "error");
            if(peerConnectionContext) return showCustomNotification("Resource Conflict", "Processing active line.", "error");
            
            isCallInitiator = true;
            currentCallSessionId = `call_${Date.now()}_${localUser.id}`;
            setupCallInterfaceHUD(type, localProfile);

            try {
                localHardwareStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === "video" });
                if(type === "video") document.getElementById("local-video-track").srcObject = localHardwareStream;

                initializePeerConnectionContext(type);

                await _client.functions.invoke("media-enrichment", { body: { type: "rtc-handshake", action: "initiate", sessionId: currentCallSessionId, offer: peerConnectionContext.localDescription, callType: type } });

                sendWebRTCSignalingPacket(targetedCallPeerId, "INVITE_REQUEST", currentCallSessionId, { callType: type, callerProfile: localProfile });
                document.getElementById("call-status-string").innerText = "Awaiting handshake sync parameters...";
            } catch(err) { cleanAndKillHardwareCallTracks(); }
        }

        function initializePeerConnectionContext(type) {
            peerConnectionContext = new RTCPeerConnection(rtcConfiguration);
            localHardwareStream.getTracks().forEach(track => peerConnectionContext.addTrack(track, localHardwareStream));

            peerConnectionContext.onicecandidate = (event) => {
                if(event.candidate && currentCallSessionId) {
                    sendWebRTCSignalingPacket(targetedCallPeerId, "ICE_CANDIDATE", currentCallSessionId, { candidate: event.candidate });
                }
            };

            peerConnectionContext.ontrack = (event) => {
                const remoteVideoElement = document.getElementById("remote-video-track");
                if(remoteVideoElement && event.streams[0]) {
                    remoteVideoElement.srcObject = event.streams[0];
                    document.getElementById("call-status-string").innerText = "Signal Handshake establish. Stream matrix active.";
                }
            };
        }

        function sendWebRTCSignalingPacket(targetId, actionString, sessionId, payloadData = {}) {
            _client.channel("realtime-signaling").send({
                type: "broadcast", event: "call-signal",
                payload: { targetPeerId: targetId, senderId: localUser.id, action: actionString, sessionId: sessionId, payload: payloadData }
            });
        }

        function launchIncomingCallInterfaceOverlay(signal) {
            currentCallSessionId = signal.sessionId;
            targetedCallPeerId = signal.senderId;
            isCallInitiator = false;

            const modal = document.getElementById("incoming-call-modal");
            document.getElementById("incoming-caller-name").innerText = signal.payload.callerProfile.name;
            document.getElementById("incoming-caller-avatar").src = signal.payload.callerProfile.profile_picture;
            document.getElementById("incoming-call-type").innerText = `Incoming ${signal.payload.callType} call request matrix`;
            modal.setAttribute("data-call-type", signal.payload.callType);
            modal.classList.remove("hidden");
        }

        async function acceptIncomingCall() {
            const modal = document.getElementById("incoming-call-modal");
            const callType = modal.getAttribute("data-call-type");
            modal.classList.add("hidden");

            const peerProfile = allProfilesList.find(p => p.id === targetedCallPeerId);
            setupCallInterfaceHUD(callType, peerProfile);

            try {
                localHardwareStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: callType === "video" });
                if(callType === "video") document.getElementById("local-video-track").srcObject = localHardwareStream;

                initializePeerConnectionContext(callType);
                sendWebRTCSignalingPacket(targetedCallPeerId, "ACCEPT_RESPONSE", currentCallSessionId);
            } catch(err) { rejectIncomingCall(); }
        }

        function rejectIncomingCall() {
            document.getElementById("incoming-call-modal").classList.add("hidden");
            sendWebRTCSignalingPacket(targetedCallPeerId, "REJECT_TERMINATE", currentCallSessionId);
            currentCallSessionId = null; targetedCallPeerId = null;
        }

        function setupCallInterfaceHUD(type, profile) {
            document.getElementById("call-panel").classList.remove("hidden");
            document.getElementById("call-peer-name").innerText = profile ? profile.name : "Peer Node Context";
            document.getElementById("call-peer-avatar").src = profile ? profile.profile_picture : "https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg";

            const isVideo = type === "video";
            document.getElementById("video-streams").classList.toggle("hidden", !isVideo);
            document.getElementById("video-streams").classList.toggle("grid", isVideo);
            document.getElementById("audio-visualizer").classList.toggle("hidden", isVideo);
            document.getElementById("call-cam-btn").classList.toggle("hidden", !isVideo);
        }

        function toggleLocalAudio() {
            if(!localHardwareStream) return;
            const track = localHardwareStream.getAudioTracks()[0];
            if(track) {
                track.enabled = !track.enabled;
                document.getElementById("call-mic-btn").classList.toggle("bg-red-500", !track.enabled);
            }
        }

        function toggleLocalVideo() {
            if(!localHardwareStream) return;
            const track = localHardwareStream.getVideoTracks()[0];
            if(track) {
                track.enabled = !track.enabled;
                document.getElementById("call-cam-btn").classList.toggle("bg-red-500", !track.enabled);
                document.getElementById("local-video-container").classList.toggle("opacity-20", !track.enabled);
            }
        }

        function terminateCall() {
            if(targetedCallPeerId && currentCallSessionId) sendWebRTCSignalingPacket(targetedCallPeerId, "REJECT_TERMINATE", currentCallSessionId);
            cleanAndKillHardwareCallTracks();
        }

        function cleanAndKillHardwareCallTracks() {
            if(localHardwareStream) { localHardwareStream.getTracks().forEach(t => t.stop()); localHardwareStream = null; }
            if(peerConnectionContext) { peerConnectionContext.close(); peerConnectionContext = null; }
            document.getElementById("local-video-track").srcObject = null;
            document.getElementById("remote-video-track").srcObject = null;
            document.getElementById("call-panel").classList.add("hidden");
            document.getElementById("incoming-call-modal").classList.add("hidden");
            currentCallSessionId = null;
        }

        // Helpers & UI
        function showCustomNotification(title, content) {
            const parent = document.getElementById("notification-container");
            const card = document.createElement("div");
            card.className = "p-4 bg-[#222e35] rounded-xl border border-[#00a884]/30 shadow-2xl flex gap-3 text-xs text-white transform transition-all duration-300 translate-x-4";
            card.innerHTML = `<div class="flex-1 min-w-0"><p class="font-bold text-[#00a884]">${title}</p><p class="text-[#e9edef] mt-1 truncate">${content}</p></div>`;
            parent.appendChild(card);
            setTimeout(() => card.remove(), 4000);
        }

        function triggerMediaAction(url, type) { commitPayloadToDatabase("", type, url); }
        function triggerInlineAudioPlayback(url) {
            if(!url) return;
            const player = document.getElementById("global-audio-player");
            if(player.src === url && !player.paused) player.pause();
            else { player.src = url; player.play().catch(() => {}); }
        }
        function launchImagePreviewModal(url) {
            const layover = document.createElement("div");
            layover.className = "fixed inset-0 bg-black/95 z-[150] flex items-center justify-center p-4 cursor-zoom-out";
            layover.innerHTML = `<div class="max-w-4xl max-h-[85vh]"><img src="${url}" class="object-contain max-h-[85vh] rounded-xl"></div>`;
            layover.onclick = () => layover.remove();
            document.body.appendChild(layover);
        }
        function toggleElement(id) { document.getElementById(id).classList.toggle("hidden"); }
        function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
        function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
    </script>
</body>
