<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattzApp Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#111b21] h-screen w-screen overflow-hidden font-sans text-[#e9edef] flex">

    <aside class="w-[400px] border-r border-[#222e35] bg-[#111b21] flex flex-col h-full">
        <header class="h-[60px] bg-[#202c33] px-4 flex items-center justify-between">
            <img id="user-avatar" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-10 h-10 rounded-full cursor-pointer border border-[#374248] object-cover" onclick="toggleProfileEdit()">
            <div class="flex gap-4 text-[#aebac1]">
                <button onclick="createNewChat()" class="hover:text-[#e9edef]">💬</button>
                <button onclick="logout()" class="hover:text-[#e9edef]">🚪</button>
            </div>
        </header>

        <div class="p-2 bg-[#111b21] border-b border-[#222e35]">
            <input type="text" id="search-channels" placeholder="Search or start new chat" class="w-full bg-[#202c33] text-sm text-[#e9edef] placeholder-[#8696a0] rounded-lg px-3 py-1.5 focus:outline-none">
        </div>

        <div id="channels-container" class="flex-1 overflow-y-auto custom-scrollbar"></div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-[#0b141a] relative">
        <header class="h-[60px] bg-[#202c33] px-4 flex items-center justify-between border-l border-[#222e35]">
            <div class="flex items-center gap-3">
                <img id="active-chat-avatar" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-10 h-10 rounded-full object-cover">
                <div>
                    <h2 id="active-chat-title" class="text-base font-medium text-[#e9edef]">Select a chat</h2>
                    <p id="active-chat-status" class="text-xs text-[#8696a0]"></p>
                </div>
            </div>
        </header>

        <div id="messages-flow" class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-3 flex flex-col bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')] bg-opacity-5"></div>

        <footer class="min-h-[60px] bg-[#202c33] px-4 py-2 flex items-center gap-3 relative">
            <div class="relative">
                <button onclick="toggleMediaDropdown()" class="text-[#aebac1] hover:text-[#e9edef] text-xl p-1">📎</button>
                <div id="media-dropdown" class="hidden absolute bottom-12 left-0 bg-[#233138] rounded-lg shadow-xl py-2 w-40 z-50 text-sm border border-[#374248]">
                    <label class="flex items-center gap-3 px-4 py-2 hover:bg-[#182229] cursor-pointer">
                        🖼️ Image <input type="file" id="media-img-input" accept="image/*" class="hidden" onchange="handleMediaUpload(this, 'image')">
                    </label>
                    <label class="flex items-center gap-3 px-4 py-2 hover:bg-[#182229] cursor-pointer">
                        🎥 Video <input type="file" id="media-vid-input" accept="video/*" class="hidden" onchange="handleMediaUpload(this, 'video')">
                    </label>
                    <button onclick="promptGiphy()" class="w-full text-left flex items-center gap-3 px-4 py-2 hover:bg-[#182229]">👾 GIF</button>
                    <button onclick="promptTunes()" class="w-full text-left flex items-center gap-3 px-4 py-2 hover:bg-[#182229]">🎵 Audio Track</button>
                </div>
            </div>

            <input type="text" id="msg-input" placeholder="Type a message" class="flex-1 bg-[#2a3942] text-[#e9edef] placeholder-[#8696a0] rounded-lg px-4 py-2 text-sm focus:outline-none">
            
            <button id="voice-record-btn" onclick="toggleVoiceRecording()" class="text-[#aebac1] hover:text-[#e9edef] text-xl p-1">🎙️</button>
        </footer>
    </main>

    <div id="profile-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-[#222e35] p-6 rounded-xl w-96 border border-[#374248]">
            <h3 class="text-lg font-medium mb-4">Edit Profile Context</h3>
            <input type="text" id="edit-display-name" placeholder="Display Name" class="w-full bg-[#2a3942] rounded px-3 py-2 text-sm mb-3 text-[#e9edef] focus:outline-none">
            <input type="text" id="edit-avatar-url" placeholder="Avatar Direct URL" class="w-full bg-[#2a3942] rounded px-3 py-2 text-sm mb-4 text-[#e9edef] focus:outline-none">
            <div class="flex justify-end gap-2">
                <button onclick="toggleProfileEdit()" class="text-sm px-4 py-2 rounded text-[#8696a0] hover:bg-[#182229]">Cancel</button>
                <button onclick="saveProfileChanges()" class="text-sm bg-[#00a884] text-black font-medium px-4 py-2 rounded hover:bg-[#008f72]">Save Changes</button>
            </div>
        </div>
    </div>

</body>
</html>
