<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattzApp Pro Extreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        // Configure Tailwind with custom colors and font for a dark theme
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        wa: {
                            bg: '#0b141a',
                            panel: '#111b21',
                            header: '#202c33',
                            input: '#2a3942',
                            teal: '#00a884',
                            tealHover: '#008f72',
                            outgoing: '#005c4b',
                            incoming: '#202c33',
                            textMuted: '#8696a0',
                            textMain: '#e9edef',
                            border: '#222e35'
                        }
        
                    }
                }
            }
        }
    </script>
    <style>
        /* Pro Custom Scrollbars */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #374248; border-radius: 99px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #4f5d64; }
        
        /* Mic Recording Pulse Animation */
        @keyframes pulse-record {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(239,68,68,0)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 8px rgba(239,68,68,0.5)); }
        }
        .recording-pulse { animation: pulse-record 1s infinite ease-in-out; color: #ef4444 !important; }
        
        /* Typing Animation */
        @keyframes typing {
          0% { opacity: 0.1; }
          20% { opacity: 1; }
          100% { opacity: 0.1; }
        }
        .typing-dot { animation: typing 1.4s infinite; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #8696a0; margin: 0 2px; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-wa-bg text-wa-textMain h-screen w-screen overflow-hidden flex antialiased selection:bg-wa-teal/30">

    <div id="auth-view" class="w-full max-w-md bg-[#222e35] p-8 rounded-2xl border border-wa-border shadow-2xl space-y-6 mx-4 transition-all duration-300 flex-none m-auto">
        <div class="text-center space-y-2">
            <div class="flex justify-center">
                <div class="p-4 bg-wa-teal/10 rounded-full text-wa-teal border border-wa-teal/20 shadow-[0_0_20px_rgba(0,168,132,0.2)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white mt-3">WattzApp Pro Extreme</h1>
            <p id="auth-subtitle" class="text-xs text-wa-textMuted">Sign in to your real-time cloud identity workspace</p>
        </div>
        
        <div class="space-y-3">
            <input type="text" id="auth-name" placeholder="Full Profile Name" class="hidden w-full bg-wa-input text-white rounded-xl px-4 py-3 text-sm placeholder-wa-textMuted border border-transparent focus:border-wa-teal focus:outline-none transition-all">
            <input type="text" id="auth-username" placeholder="Unique Username Handle" class="hidden w-full bg-wa-input text-white rounded-xl px-4 py-3 text-sm placeholder-wa-textMuted border border-transparent focus:border-wa-teal focus:outline-none transition-all">
            <input type="email" id="auth-email" placeholder="Email Address" class="w-full bg-wa-input text-white rounded-xl px-4 py-3 text-sm placeholder-wa-textMuted border border-transparent focus:border-wa-teal focus:outline-none transition-all">
            <input type="password" id="auth-password" placeholder="Secure Password" class="w-full bg-wa-input text-white rounded-xl px-4 py-3 text-sm placeholder-wa-textMuted border border-transparent focus:border-wa-teal focus:outline-none transition-all">
            
            <button onclick="submitAuthForm()" id="auth-btn" class="w-full bg-wa-teal text-black font-semibold rounded-xl py-3 text-sm hover:bg-wa-tealHover shadow-lg hover:shadow-wa-teal/10 transition-all active:scale-[0.99] mt-2">
                Sign In
            </button>
        </div>
        
        <div class="text-center text-xs text-wa-textMuted pt-2">
            <span id="auth-toggle-msg">New to WattzApp Pro Extreme?</span>
            <button onclick="toggleAuthMode()" id="auth-toggle-link" class="text-wa-teal hover:underline font-medium ml-1 bg-transparent border-none">Create account</button>
        </div>
    </div>

    <div id="app-view" class="hidden w-full h-full flex overflow-hidden">
        
        <aside class="w-[380px] bg-wa-panel border-r border-wa-border flex flex-col h-full flex-shrink-0">
            <header class="h-[64px] bg-wa-header px-4 flex items-center justify-between border-b border-wa-border/40 shadow-sm">
                <div class="flex items-center gap-3">
                    <img id="user-avatar" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-10 h-10 rounded-full cursor-pointer object-cover border-2 border-wa-border hover:border-wa-teal transition-all" onclick="openModal('profile-modal')" title="Edit Profile Details">
                    <div>
                        <p id="user-name-display" class="text-sm font-semibold text-wa-textMain"></p>
                        <p id="user-username-display" class="text-xs text-wa-textMuted"></p>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-wa-textMuted">
                    <button onclick="createNewChannel()" class="p-2 hover:bg-wa-input hover:text-wa-textMain rounded-xl transition-all" title="New Room Workspace">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button onclick="createNewPrivateChat()" class="p-2 hover:bg-wa-input hover:text-wa-textMain rounded-xl transition-all" title="New Private Chat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
                    </button>
                    <button onclick="terminateSession()" class="p-2 hover:bg-wa-input hover:text-red-400 rounded-xl transition-all" title="Secure Logout">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </header>
            
            <div class="p-3 bg-wa-panel border-b border-wa-border/50">
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-wa-textMuted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </span>
                    <input type="text" placeholder="Search operational interface nodes..." class="w-full bg-wa-header text-xs rounded-xl pl-10 pr-4 py-2.5 text-wa-textMain placeholder-wa-textMuted focus:outline-none border border-transparent focus:border-wa-border/60 transition-all">
                </div>
            </div>
            
            <div id="channels-list" class="flex-1 overflow-y-auto custom-scroll divide-y divide-wa-border/30"></div>
        </aside>

        <main class="flex-1 bg-wa-bg flex flex-col h-full relative">
            <header class="h-[64px] bg-wa-header px-4 flex items-center justify-between shadow-md z-10 border-b border-wa-border/20">
                <div class="flex items-center gap-3.5">
                    <img id="active-room-avatar" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-10 h-10 rounded-full object-cover border border-wa-border">
                    <div>
                        <h2 id="active-room-title" class="text-sm font-semibold text-white tracking-wide">Select an operation node</h2>
                        <div id="active-room-status" class="text-[11px] text-wa-teal font-medium tracking-wide mt-0.5 min-h-[15px] flex items-center gap-1.5"></div>
                    </div>
                </div>
                
                <div id="call-actions" class="hidden flex items-center gap-2 text-wa-textMuted">
                    <button onclick="initiateWebRTCCall('audio')" class="p-2.5 hover:bg-wa-input hover:text-wa-teal rounded-xl transition-all" title="Audio Call">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </button>
                    <button onclick="initiateWebRTCCall('video')" class="p-2.5 hover:bg-wa-input hover:text-wa-teal rounded-xl transition-all" title="Video Call">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7a2 2 0 0 0-2.45-1.45L16 7V5a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2l4.55 1.45A2 2 0 0 0 23 17V7z"/></svg>
                    </button>
                </div>
            </header>

            <div id="messages-flow" class="flex-1 overflow-y-auto custom-scroll p-6 space-y-4 bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')] bg-opacity-[0.02]"></div>

            <footer id="input-dock" class="hidden min-h-[64px] bg-wa-header px-4 py-2.5 flex items-center gap-3 relative border-t border-wa-border/40 z-10">
                <div class="relative">
                    <button onclick="toggleElement('media-menu')" class="p-2.5 text-wa-textMuted hover:bg-wa-input hover:text-white rounded-xl transition-all flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <div id="media-menu" class="hidden absolute bottom-14 left-0 bg-[#233138] rounded-xl shadow-2xl py-2 w-48 border border-wa-border z-50 text-xs font-medium animate-fade-in">
                        <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-wa-panel cursor-pointer text-wa-textMain">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" w="18" h="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Image Pipeline
                            <input type="file" accept="image/*" class="hidden" onchange="processMediaFile(this, 'image')">
                        </label>
                        <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-wa-panel cursor-pointer text-wa-textMain">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7a2 2 0 0 0-2.45-1.45L16 7V5a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2l4.55 1.45A2 2 0 0 0 23 17V7z"/></svg> Video File
                            <input type="file" accept="video/*" class="hidden" onchange="processMediaFile(this, 'video')">
                        </label>
                        <button onclick="openMediaSearchModal('gif')" class="w-full text-left flex items-center gap-3 px-4 py-2.5 hover:bg-wa-panel text-wa-textMain">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" w="18" h="18" rx="2" ry="2"/><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg> Giphy Engine Asset
                        </button>
                        <button onclick="openMediaSearchModal('music')" class="w-full text-left flex items-center gap-3 px-4 py-2.5 hover:bg-wa-panel text-wa-textMain">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> iTunes Music Clip
                        </button>
                    </div>
                </div>

                <div class="flex-1 relative">
                    <input type="text" id="msg-field" placeholder="Type data message stream..." class="w-full bg-wa-input rounded-xl px-4 py-3 text-xs text-white placeholder-wa-textMuted focus:outline-none border border-transparent focus:border-wa-border transition-all" oninput="handleInputFieldChange(this)">
                    <div id="username-suggestions" class="hidden absolute bottom-full left-0 w-full bg-[#233138] rounded-xl shadow-2xl border border-wa-border max-h-40 overflow-y-auto custom-scroll z-50"></div>
                </div>
                <button id="mic-trigger" onclick="handleVoiceNoteRecording()" class="p-2.5 text-wa-textMuted hover:bg-wa-input hover:text-white rounded-xl transition-all flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v10a3 3 0 0 0 3-3V1a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3H12z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                </button>
            </footer>
        </main>
    </div>

    <div id="notification-container" class="fixed top-4 right-4 z-[100] space-y-3 w-80"></div>

    <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-[#222e35] rounded-2xl p-6 w-full max-w-md border border-wa-border space-y-5 shadow-2xl overflow-y-auto custom-scroll max-h-[90vh]">
            <h3 class="text-lg font-bold text-white tracking-wide">Account Settings</h3>
            
            <div class="flex flex-col items-center gap-3 border-b border-wa-border/40 pb-4">
                <img id="edit-avatar-preview" src="https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg" class="w-24 h-24 rounded-full object-cover border-4 border-wa-border">
                <label class="bg-wa-header text-wa-textMain text-xs px-4 py-2 rounded-xl cursor-pointer hover:bg-wa-input transition-all">
                    Change Picture Pipeline
                    <input type="file" accept="image/*" class="hidden" onchange="previewAndSetAvatar(this)">
                </label>
            </div>

            <div class="space-y-3">
                <input type="text" id="edit-name" placeholder="Display Profile Name" class="w-full bg-wa-input rounded-xl px-4 py-3 text-sm border border-transparent focus:border-wa-teal focus:outline-none text-white">
                <input type="text" id="edit-username" placeholder="Unique Username Handle" class="w-full bg-wa-input rounded-xl px-4 py-3 text-sm border border-transparent focus:border-wa-teal focus:outline-none text-white">
            </div>

            <div class="border-t border-wa-border/40 pt-4 space-y-3">
                <h4 class="text-sm font-semibold text-white">Change Password Token</h4>
                <input type="password" id="edit-new-password" placeholder="New Password" class="w-full bg-wa-input rounded-xl px-4 py-3 text-sm border border-transparent focus:border-wa-teal focus:outline-none text-white">
                <input type="password" id="edit-confirm-password" placeholder="Confirm New Password" class="w-full bg-wa-input rounded-xl px-4 py-3 text-sm border border-transparent focus:border-wa-teal focus:outline-none text-white">
            </div>

            <div class="border-t border-wa-border/40 pt-4 space-y-3">
                <h4 class="text-sm font-semibold text-red-400">Danger Zone</h4>
                <button onclick="confirmAccountDeletion()" class="w-full bg-red-500/10 text-red-400 font-medium rounded-xl py-3 text-sm hover:bg-red-500 hover:text-white transition-all">
                    Delete Account Permanently
                </button>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal('profile-modal')" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-wa-textMuted hover:bg-wa-panel transition-all">Cancel</button>
                <button onclick="commitProfileUpdates()" class="px-5 py-2.5 bg-wa-teal text-black font-semibold rounded-xl text-sm hover:bg-wa-tealHover transition-all">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="media-search-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-[#222e35] rounded-2xl p-6 w-full max-w-xl border border-wa-border space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 id="media-search-title" class="text-lg font-bold text-white tracking-wide"></h3>
                <button onclick="closeModal('media-search-modal')" class="text-wa-textMuted hover:text-white">&times;</button>
            </div>
            <div class="relative">
                <input type="text" id="media-search-input" placeholder="Search operational interface nodes..." class="w-full bg-wa-header text-sm rounded-xl px-4 py-3 text-wa-textMain placeholder-wa-textMuted focus:outline-none border border-wa-border transition-all">
                <button onclick="performMediaSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-wa-teal text-black text-xs font-semibold px-4 py-1.5 rounded-lg hover:bg-wa-tealHover">Search</button>
            </div>
            <div id="media-search-results" class="grid grid-cols-3 gap-3 max-h-80 overflow-y-auto custom-scroll p-1"></div>
        </div>
    </div>

    <div id="incoming-call-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-[100] p-6 animate-fade-in">
        <div class="flex flex-col items-center space-y-8 text-center">
            <img id="incoming-caller-avatar" src="" class="w-32 h-32 rounded-full object-cover ring-8 ring-wa-teal/20 animate-pulse">
            <div class="space-y-1">
                <h2 id="incoming-caller-name" class="text-2xl font-bold text-white tracking-wide"></h2>
                <p id="incoming-call-type" class="text-sm text-wa-teal font-medium tracking-widest uppercase"></p>
            </div>
            <div class="flex gap-10">
                <button onclick="rejectIncomingCall()" class="w-20 h-20 rounded-full bg-red-500 text-white flex items-center justify-center shadow-xl hover:bg-red-600 transition-all transform hover:scale-105">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" fill="currentColor"/></svg>
                </button>
                <button onclick="acceptIncomingCall()" class="w-20 h-20 rounded-full bg-wa-teal text-black flex items-center justify-center shadow-xl hover:bg-wa-tealHover transition-all transform hover:scale-105">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="call-panel" class="hidden fixed inset-0 bg-wa-bg/95 backdrop-blur-md flex flex-col items-center justify-center z-50 p-6 animate-fade-in">
        <div class="w-full max-w-4xl h-full flex flex-col items-center space-y-6">
            <div class="text-center space-y-2">
                <div class="relative inline-block">
                    <img id="call-peer-avatar" src="" class="w-24 h-24 rounded-full object-cover ring-4 ring-wa-teal shadow-2xl">
                    <div id="call-type-indicator" class="absolute -bottom-1 -right-1 bg-wa-header p-2 rounded-full border border-wa-border text-white flex items-center justify-center shadow-md"></div>
                </div>
                <h2 id="call-peer-name" class="text-xl font-bold text-white tracking-wide"></h2>
                <p id="call-status-string" class="text-xs text-wa-teal font-semibold tracking-widest uppercase">Connecting Signal Node...</p>
            </div>

            <div id="video-streams" class="hidden w-full flex-1 grid grid-cols-2 gap-4 bg-wa-panel rounded-2xl p-4 border border-wa-border shadow-inner relative">
                <div class="bg-black rounded-xl overflow-hidden relative border border-wa-border/40">
                    <video id="remote-video-track" autoplay playsinline class="w-full h-full object-cover"></video>
                    <span id="remote-track-label" class="absolute bottom-2.5 left-2.5 bg-black/60 backdrop-blur-sm px-3 py-1 rounded-lg text-xs font-medium text-wa-textMain">Peer Stream</span>
                </div>

async function submitAuthForm() {
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value.trim();
    if(!email || !password) return showCustomNotification("System", "Required parameters missing.", "error");

    if(authState === "LOGIN") {
        const { data, error } = await _client.auth.signInWithPassword({ email, password });
        if(error) return showCustomNotification("Auth Error", error.message, "error");
        localUser = data.user;
        await bootAppInterfaceWorkspace();
    } else {
        const name = document.getElementById("auth-name").value.trim();
        const username = document.getElementById("auth-username").value.trim().toLowerCase().replace(/[^a-z0-span0-9_]/g, "");
        if(!name || !username) return showCustomNotification("System", "Metadata configuration parameters missing.", "error");

        const { data, error } = await _client.auth.signUp({ email, password });
        if(error) return showCustomNotification("Registration Fail", error.message, "error");
        
        if(data.user) {
            const { error: profileError } = await _client.from("profiles").insert([{
                id: data.user.id, name, username, email, profile_picture: "https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg"
            }]);
            if(profileError) return showCustomNotification("Database Error", profileError.message, "error");
            showCustomNotification("Security", "Profile initialization completed successfully.", "success");
            localUser = data.user;
            await bootAppInterfaceWorkspace();
        }
    }
}

    const newPassword = document.getElementById("edit-new-password").value;

    if(!updatedName || !updatedUsername) return showCustomNotification("Error", "Name and username handles are invariant fields.", "error");

    let profilePayload = { name: updatedName, username: updatedUsername };
    if(temporaryAvatarBlobBase64) {
        profilePayload.profile_picture = temporaryAvatarBlobBase64;
    }

    const { error: profileError } = await _client.from("profiles").update(profilePayload).eq("id", localUser.id);
    if(profileError) return showCustomNotification("Update Error", profileError.message, "error");

    if(newPassword) {

        const { error: pwdError } = await _client.auth.updateUser({ password: newPassword });

            const peerProfile = allProfilesList.find(p => p.id === peerId);
            room._displayName = peerProfile ? `${peerProfile.name} (@${peerProfile.username})` : "Secured Workspace Node";

async function createNewPrivateChat() {
    const handle = prompt("Enter target peer profile user handle name (@username):");
    if(!handle) return;
    const standardizedHandle = handle.replace("@", "").trim().toLowerCase();

    if(standardizedHandle === localProfile.username) {
        return showCustomNotification("System Loop", "Loopback data links on identity index are invalid.", "error");
    }

    const peer = allProfilesList.find(p => p.username === standardizedHandle);
    if(!peer) return showCustomNotification("Error", "Target user record missing inside cluster nodes.", "error");

    // Order lexicographically to guarantee dynamic ID formatting uniqueness "lowID--highID"
    const uniqueStringId = [localUser.id, peer.id].sort().join("--");

    // Idempotency check: see if dynamic room mapping string track already exists
    const { data: activeRooms } = await _client.from("channels").select("*").eq("name", uniqueStringId).eq("is_group", false);
    if(activeRooms && activeRooms.length > 0) {
        return mountActiveChatChannelTarget(activeRooms[0]);
    }

    const { data: createdRoom, error } = await _client.from("channels").insert([{ name: uniqueStringId, is_group: false }]).select().single();
    if(error) return showCustomNotification("Error", error.message, "error");

    await populateSidebarChannels();
    mountActiveChatChannelTarget(createdRoom);
}

// =========================================================================
// REAL-TIME POSTGRES SYNC LAYER & SPY NETWORKS
// =========================================================================
function configureRealtimeGlobalSubscriptions() {
    if(globalMsgSubscription) globalMsgSubscription.unsubscribe();
    if(broadcastTypingSubscription) broadcastTypingSubscription.unsubscribe();
    if(signalingCallSubscription) signalingCallSubscription.unsubscribe();

    // Structural Message Row Replication Engine Sync
    globalMsgSubscription = _client.channel("public:messages")
    .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, async (payload) => {
        if(!selectedChannel) return;
        
        // Ensure incoming packet belongs to our active view channel bounds
        if(payload.new?.channel_id === selectedChannel.id || payload.old?.channel_id === selectedChannel.id) {
            if(payload.new && payload.new.sender_id !== localUser.id) {
                await markMessagesAsReadInChannel(selectedChannel.id);
            }
            await extractRenderMessagesFlowChain();
        } else {
            // Trigger customized ambient user interface notifications for out of view incoming updates
            if(payload.new && payload.new.sender_id !== localUser.id) {
                const sendingPeer = allProfilesList.find(p => p.id === payload.new.sender_id);
                const notificationTitle = sendingPeer ? sendingPeer.name : "System Update";
                const notificationBody = payload.new.media_type !== "text" ? `Sent an asset payload [${payload.new.media_type}]` : payload.new.content;
                showCustomNotification(notificationTitle, notificationBody, "info");
            }
        }
    }).subscribe();

    // Broadcast Typometrics Matrix Synchronizer
    broadcastTypingSubscription = _client.channel("public:typing")
    .on("broadcast", { event: "metrics" }, (packet) => {
        if(!selectedChannel || packet.payload.room !== selectedChannel.id) return;

        const statusBox = document.getElementById("active-room-status");
        if(packet.payload.isTyping) {
            // SPY NODE EVALUATION LAYER: Read data directly if user targeting triggers active node evaluation parameters
            if(targetedSpyUsername === packet.payload.handler.toLowerCase()) {
                statusBox.innerHTML = `<span class="text-red-400 animate-pulse">● Spy Node Engine:</span> <span class="text-white font-mono bg-black/40 px-1.5 py-0.5 rounded border border-white/5 select-all">${packet.payload.rawBuffer}</span>`;
            } else {
                statusBox.innerHTML = `
                    <div class="flex items-center gap-1">
                        <span class="text-wa-teal font-semibold">${packet.payload.senderName} is writing</span>
                        <div class="flex items-center h-full pt-1"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
                    </div>`;
            }
        } else {
            statusBox.innerHTML = `<span>●</span> Cloud Sync Online`;
        }
    }).subscribe();

    // WebRTC Real-Time Signaling Infrastructure Matrix Link
    signalingCallSubscription = _client.channel("public:signaling")
    .on("broadcast", { event: "call-signal" }, async (envelope) => {
        const signal = envelope.payload;
        if(signal.targetPeerId !== localUser.id) return; // Discard unaligned route nodes

        switch(signal.action) {
            case "INVITE_REQUEST":
                if(currentCallSessionId) {
                    // Send explicit busy responses if processing another line payload thread
                    sendWebRTCSignalingPacket(signal.senderId, "BUSY_LINE", signal.sessionId);
                    return;
                }
                launchIncomingCallInterfaceOverlay(signal);
                break;
            case "ACCEPT_RESPONSE":
                if(currentCallSessionId === signal.sessionId) {
                    document.getElementById("call-status-string").innerText = "Signal Handshake established. Creating local description state vectors...";
                    const { data } = await _client.functions.invoke("media-enrichment", {
                        body: { type: "rtc-handshake", action: "get-offer", sessionId: currentCallSessionId }
                    });
                    if(data?.offer) {
                        await peerConnectionContext.setRemoteDescription(new RTCSessionDescription(data.offer));
                        const answer = await peerConnectionContext.createAnswer();
                        await peerConnectionContext.setLocalDescription(answer);
                        sendWebRTCSignalingPacket(targetedCallPeerId, "SDP_ANSWER", currentCallSessionId, { answer });
                    }
                }
                break;
            case "SDP_ANSWER":
                if(currentCallSessionId === signal.sessionId && peerConnectionContext) {
                    await peerConnectionContext.setRemoteDescription(new RTCSessionDescription(signal.payload.answer));
                }
                break;
            case "ICE_CANDIDATE":
                if(currentCallSessionId === signal.sessionId && peerConnectionContext && signal.payload.candidate) {
                    try {
                        await peerConnectionContext.addIceCandidate(new RTCIceCandidate(signal.payload.candidate));
                    } catch(e) {}
                }
                break;
            case "REJECT_TERMINATE":
                if(currentCallSessionId === signal.sessionId || !currentCallSessionId) {
                    cleanAndKillHardwareCallTracks();
                    showCustomNotification("Call Routing", "WebRTC stream terminated by remote node.", "info");
                }
                break;
            case "BUSY_LINE":
                showCustomNotification("Call Routing", "Peer connection rejected: Node resource line is busy.", "error");
                cleanAndKillHardwareCallTracks();
                break;
        }
    }).subscribe();
}

// =========================================================================
// INPUT FIELD INTERACTION & USERNAME AUTOCOMPLETE
// =========================================================================
function handleInputFieldChange(element) {
    if(!selectedChannel) return;
    const value = element.value;
    const cursorIndex = element.selectionStart;
    
    // Scan string configurations backwards to locate matching text tags
    const textSegmentBeforeCursor = value.slice(0, cursorIndex);
    const triggeringMatch = textSegmentBeforeCursor.match(/\/\[see_([a-zA-Z0-9_]*)$/);

    if (selectedChannel.is_group && triggeringMatch) {
        const inputStringQuery = triggeringMatch[1].toLowerCase();
        const targetedSuggestions = allProfilesList.filter(p => p.username.toLowerCase().includes(inputStringQuery));
        renderUsernameSuggestionsDropdown(targetedSuggestions, triggeringMatch[0]);
    } else {
        document.getElementById("username-suggestions").classList.add("hidden");
    }

    // Evaluate structural spy extraction configurations natively inside string buffers
    const inlineSpyEvaluator = value.match(/\/\[see_([a-zA-Z0-9_]+)\]/);
    if(inlineSpyEvaluator) {
        targetedSpyUsername = inlineSpyEvaluator[1].toLowerCase();
    } else if(value.trim() === "/[see]") {
        if(!selectedChannel.is_group) {
            const userTokens = selectedChannel.name.split("--");
            const peerId = userTokens.find(id => id !== localUser.id);
            const peerProfile = allProfilesList.find(p => p.id === peerId);
            if(peerProfile) targetedSpyUsername = peerProfile.username.toLowerCase();
        }
    }

    // Broadcast standard real-time metrics across channels
    _client.channel("public:typing").send({
        type: "broadcast",
        event: "metrics",
        payload: {
            room: selectedChannel.id,
            senderName: localProfile.name,
            handler: localProfile.username,
            isTyping: value.length > 0,
            rawBuffer: value
        }
    });

    clearTimeout(typingDebounceTimeout);
    typingDebounceTimeout = setTimeout(() => {
        _client.channel("public:typing").send({
            type: "broadcast",
            event: "metrics",
            payload: { room: selectedChannel.id, isTyping: false }
        });
    }, 2000);
}

// =========================================================================
// INLINE AUDIO REPRODUCER (VOICE NOTES ENGINE)
// =========================================================================
async function handleVoiceNoteRecording() {
    const triggerBtn = document.getElementById("mic-trigger");
    
    if(!audioRecorderInstance || audioRecorderInstance.state === "inactive") {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioRecorderInstance = new MediaRecorder(stream);
            audioCapturedChunks = [];

            audioRecorderInstance.ondataavailable = e => audioCapturedChunks.push(e.data);
            audioRecorderInstance.onstop = () => {
                const blob = new Blob(audioCapturedChunks, { type: "audio/ogg; codecs=opus" });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = async () => {
                    await commitPayloadToDatabase("", "audio", reader.result);
                };
            };

            audioRecorderInstance.start();
            triggerBtn.classList.add("recording-pulse");
            showCustomNotification("Media Peripheral", "Audio console capture array active.", "info");
        } catch(err) {
            showCustomNotification("Peripheral Fault", "Audio hardware permissions locked.", "error");
        }
    } else {
        audioRecorderInstance.stop();
        triggerBtn.classList.remove("recording-pulse");
    }
}

// =========================================================================
// WEBRTC PEER CONNECTION AND DISCOVERY ENGINE
// =========================================================================
async function initiateWebRTCCall(type) {
    if(!targetedCallPeerId) return showCustomNotification("Route Mapping", "No clear target identity node bound.", "error");
    
    isCallInitiator = true;
    currentCallSessionId = `call_${Date.now()}_${localUser.id}`;
    
    setupCallInterfaceHUD(type, localProfile);
    document.getElementById("call-status-string").innerText = "Generating network channel routing keys...";

    try {
        localHardwareStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: type === "video"
        });

        if(type === "video") {
            document.getElementById("local-video-track").srcObject = localHardwareStream;
        }

        // Initialize WebRTC stack parameters natively
        initializePeerConnectionContext(type);

        // Remote database edge pipeline payload offload integration rules configuration execution
        const { error } = await _client.functions.invoke("media-enrichment", {
            body: { 
                type: "rtc-handshake", 
                action: "initiate", 
                sessionId: currentCallSessionId, 
                offer: peerConnectionContext.localDescription, 
                callType: type 
            }
        });

        if(error) throw error;

        // Broadcast initial route signaling invite parameters packet across network pipeline
        sendWebRTCSignalingPacket(targetedCallPeerId, "INVITE_REQUEST", currentCallSessionId, {
            callType: type,
            callerProfile: localProfile
        });

        document.getElementById("call-status-string").innerText = "Awaiting remote peer handshake sync...";

    } catch(err) {
        showCustomNotification("Hardware Error", "Call initialization failed: " + err.message, "error");
        cleanAndKillHardwareCallTracks();
    }
}

function initializePeerConnectionContext(type) {
    peerConnectionContext = new RTCPeerConnection(rtcConfiguration);

    localHardwareStream.getTracks().forEach(track => {
        peerConnectionContext.addTrack(track, localHardwareStream);
    });

    peerConnectionContext.onicecandidate = (event) => {
        if(event.candidate && currentCallSessionId) {
            sendWebRTCSignalingPacket(targetedCallPeerId, "ICE_CANDIDATE", currentCallSessionId, { candidate: event.candidate });
        }
    };

    peerConnectionContext.ontrack = (event) => {
        const remoteVideoElement = document.getElementById("remote-video-track");
        if(remoteVideoElement && event.streams[0]) {
            remoteVideoElement.srcObject = event.streams[0];
            document.getElementById("call-status-string").innerText = "P2P Stream established securely.";
        }
    };
}

function sendWebRTCSignalingPacket(targetId, actionString, sessionId, payloadData = {}) {
    _client.channel("public:signaling").send({
        type: "broadcast",
        event: "call-signal",
        payload: {
            targetPeerId: targetId,
            senderId: localUser.id,
            action: actionString,
            sessionId: sessionId,
            payload: payloadData
        }
    });
}

function launchIncomingCallInterfaceOverlay(signal) {
    currentCallSessionId = signal.sessionId;
    targetedCallPeerId = signal.senderId;
    isCallInitiator = false;

    const modal = document.getElementById("incoming-call-modal");
    document.getElementById("incoming-caller-name").innerText = signal.payload.callerProfile.name;
    document.getElementById("incoming-caller-avatar").src = signal.payload.callerProfile.profile_picture;
    document.getElementById("incoming-call-type").innerText = `Incoming ${signal.payload.callType} Call`;
    
    modal.setAttribute("data-call-type", signal.payload.callType);
    modal.classList.remove("hidden");
}

async function acceptIncomingCall() {
    const modal = document.getElementById("incoming-call-modal");
    const callType = modal.getAttribute("data-call-type");
    modal.classList.add("hidden");

    const peerProfile = allProfilesList.find(p => p.id === targetedCallPeerId);
    setupCallInterfaceHUD(callType, peerProfile);
    document.getElementById("call-status-string").innerText = "Syncing system hardware channels...";

    try {
        localHardwareStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: callType === "video"
        });

        if(callType === "video") {
            document.getElementById("local-video-track").srcObject = localHardwareStream;
        }

        initializePeerConnectionContext(callType);

        // Generate response message packet tracking parameters
        sendWebRTCSignalingPacket(targetedCallPeerId, "ACCEPT_RESPONSE", currentCallSessionId);

    } catch(err) {
        showCustomNotification("Hardware Error", "Could not connect call: " + err.message, "error");
        rejectIncomingCall();
    }
}

function rejectIncomingCall() {
    document.getElementById("incoming-call-modal").classList.add("hidden");
    sendWebRTCSignalingPacket(targetedCallPeerId, "REJECT_TERMINATE", currentCallSessionId);
    currentCallSessionId = null;
    targetedCallPeerId = null;
}

function setupCallInterfaceHUD(type, profile) {
    document.getElementById("call-panel").classList.remove("hidden");
    document.getElementById("call-peer-name").innerText = profile ? profile.name : "Peer Node Context";
    document.getElementById("call-peer-avatar").src = profile ? profile.profile_picture : "https://raw.githubusercontent.com/Csing102/Wattz/refs/heads/main/user.jpeg";

    const isVideo = type === "video";
    document.getElementById("video-streams").classList.toggle("hidden", !isVideo);
    document.getElementById("video-streams").classList.toggle("grid", isVideo);
    document.getElementById("audio-visualizer").classList.toggle("hidden", isVideo);
    document.getElementById("call-cam-btn").classList.toggle("hidden", !isVideo);

    // Dynamic track configuration baseline defaults reset
    document.getElementById("call-mic-btn").className = "w-12 h-12 rounded-full bg-wa-panel text-white hover:bg-wa-input flex items-center justify-center border border-wa-border transition-all";
    document.getElementById("call-cam-btn").className = "w-12 h-12 rounded-full bg-wa-panel text-white hover:bg-wa-input flex items-center justify-center border border-wa-border transition-all";
}

function toggleLocalAudio() {
    if(!localHardwareStream) return;
    const audioTrack = localHardwareStream.getAudioTracks()[0];
    if(audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        const btn = document.getElementById("call-mic-btn");
        btn.classList.toggle("bg-red-500", !audioTrack.enabled);
        btn.classList.toggle("text-white", audioTrack.enabled);
    }
}

function toggleLocalVideo() {
    if(!localHardwareStream) return;
    const videoTrack = localHardwareStream.getVideoTracks()[0];
    if(videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        const btn = document.getElementById("call-cam-btn");
        btn.classList.toggle("bg-red-500", !videoTrack.enabled);
        btn.classList.toggle("text-white", videoTrack.enabled);
        
        document.getElementById("local-video-container").classList.toggle("opacity-20", !videoTrack.enabled);
    }
}

function terminateCall() {
    if(targetedCallPeerId && currentCallSessionId) {
        sendWebRTCSignalingPacket(targetedCallPeerId, "REJECT_TERMINATE", currentCallSessionId);
    }
    cleanAndKillHardwareCallTracks();
}

function cleanAndKillHardwareCallTracks() {
    if(localHardwareStream) {
        localHardwareStream.getTracks().forEach(track => track.stop());
        localHardwareStream = null;
    }
    if(peerConnectionContext) {
        peerConnectionContext.close();
        peerConnectionContext = null;
    }
    document.getElementById("local-video-track").srcObject = null;
    document.getElementById("remote-video-track").srcObject = null;
    document.getElementById("call-panel").classList.add("hidden");
    document.getElementById("incoming-call-modal").classList.add("hidden");
    
    currentCallSessionId = null;
}

    card.innerHTML = `
        <div class="flex-1 min-w-0">
            <p class="font-bold tracking-wide text-wa-teal">${title}</p>
            <p class="text-wa-textMain mt-1 truncate">${content}</p>
        </div>
        <button class="text-wa-textMuted hover:text-white font-bold text-sm h-fit self-start">&times;</button>
    `;

    parentContainer.appendChild(card);
    
    // Trigger computational entry interpolation matrix ticks
    setTimeout(() => {
        card.classList.remove("translate-x-12", "opacity-0");
    }, 50);

    const closeHandler = () => {
        card.classList.add("translate-x-12", "opacity-0");
        setTimeout(() => card.remove(), 300);
    };

    card.querySelector("button").onclick = closeHandler;
    setTimeout(closeHandler, 4500); // Standard layout duration baseline delay
}

function launchImagePreviewModal(url) {
    const containerLayover = document.createElement("div");
    containerLayover.className = "fixed inset-0 bg-black/95 backdrop-blur-md z-[150] flex flex-col items-center justify-center p-4 cursor-zoom-out animate-fade-in";
    containerLayover.innerHTML = `
        <div class="relative max-w-4xl max-h-[85vh] overflow-hidden rounded-xl border border-white/10 shadow-2xl">
            <img src="${url}" class="w-full h-full object-contain max-h-[85vh]">
        </div>
        <p class="text-xs text-wa-textMuted font-medium tracking-wide mt-4 select-none">Click outer coordinates anywhere to exit preview nodes</p>
    `;
    containerLayover.onclick = () => {
        containerLayover.classList.add("opacity-0");
        setTimeout(() => containerLayover.remove(), 200);
    };
    document.body.appendChild(containerLayover);
}

// =========================================================================
// STRUCTURAL UTILITY INTERFACES
// =========================================================================
function toggleElement(id) { document.getElementById(id).classList.toggle("hidden"); }
function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
    </script>
</body>
